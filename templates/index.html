<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Dashboard Completo de Tráfego</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; margin:20px; }
        #container { max-width:1000px; margin:auto; }
        canvas { background:#fff; border:1px solid #ddd; }
        #modal { display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); background:#fff; padding:10px; border:1px solid #ccc; z-index:999; }
    </style>
</head>
<body>
    <div id="container">
        <h1>Tráfego do Servidor</h1>
        <canvas id="grafico" width="1000" height="400"></canvas>
    </div>
    <div id="modal">
        <h3 id="modalTitle"></h3>
        <canvas id="modalChart" width="600" height="300"></canvas>
        <br/><button id="closeModal">Fechar</button>
    </div>
    <script>
        const protoMap = {1:'ICMP',6:'TCP',17:'UDP'};
        let ctx = document.getElementById('grafico').getContext('2d');
        let chart = new Chart(ctx, {type:'bar', data:{labels:[], datasets:[]}, options:{responsive:true, onClick:onClickHandler, scales:{x:{stacked:true}, y:{stacked:true}}}});
        let modal = document.getElementById('modal');
        let modalTitle = document.getElementById('modalTitle');
        let modalCtx = document.getElementById('modalChart').getContext('2d');
        let modalChart = new Chart(modalCtx, {type:'pie', data:{labels:[], datasets:[{data:[]}]}, options:{}});
        let trafegoAtual = {};

        async function atualizar(){
            try{
                const res = await fetch('/dados');
                const data = await res.json();
                trafegoAtual = data;
                const ips = Object.keys(data);
                chart.data.labels = ips;
                chart.data.datasets = [];
                const protos = Object.keys(protoMap);
                for(const p of protos){
                    chart.data.datasets.push({label: protoMap[p], data: ips.map(ip=>data[ip].protocolos[p]||0), backgroundColor:`hsl(${p*60},70%,50%)`});
                }
                chart.update();
            }catch(e){console.error(e);}
        }

        function onClickHandler(evt, elems){
            const points = chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},false);
            if(points.length){
                const idx = points[0].index;
                const ip = chart.data.labels[idx];
                const detalhes = trafegoAtual[ip].protocolos;
                const labels=[], values=[];
                for(const [k,v] of Object.entries(detalhes)){labels.push(protoMap[k]||('proto:'+k)); values.push(v);}
                modalTitle.innerText = 'Breakdown por protocolo: '+ip;
                modalChart.data.labels = labels;
                modalChart.data.datasets[0].data = values;
                modalChart.update();
                modal.style.display='block';
            }
        }

        document.getElementById('closeModal').addEventListener('click',()=>{modal.style.display='none';});
        setInterval(atualizar,5000);
        atualizar();
    </script>
</body>
</html>
